# RETIRED transitional proxy: forwards every request to the chapel-backend service.
server {
    listen 80;
    server_name _;
    client_max_body_size 64M;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'healthy';
    }

    location / {
        resolver 127.0.0.11 1.1.1.1 8.8.8.8 valid=10s ipv6=off;
        set $backend_url "${BACKEND_URL}";
        proxy_pass $backend_url;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Shown only if the backend is unreachable
    error_page 502 503 504 /offline.html;
    location = /offline.html {
        root /usr/share/nginx/html;
        internal;
    }
}
