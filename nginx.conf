server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html offline.html;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json image/svg+xml;

    # Health Check Endpoint for Dokploy
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'healthy';
    }

    # Static Assets Caching
    location ~* \.(css|js|svg|png|jpg|jpeg|gif|ico|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        try_files $uri =404;
    }

    # API Proxy to Backend Container on Dokploy Network
    location /api/ {
        resolver 127.0.0.11 valid=30s;
        set $backend_host http://backend:80;
        proxy_pass $backend_host;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Fallback to index / offline PWA
    location / {
        try_files $uri $uri/ /index.html;
    }
}
